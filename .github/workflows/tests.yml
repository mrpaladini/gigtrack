name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, dom

      - name: Sintaxe do PHP
        run: php -l api/cifra.php

      - name: Sintaxe do JavaScript
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: Importador de cifras
        run: bash tests/test-cifra-php.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Navegador de teste
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: App em celular, tablet e desktop
        run: python tests/run-tests.py

      - name: Guardar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: tests/output/
